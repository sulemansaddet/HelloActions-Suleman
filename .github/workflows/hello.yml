# The name displayed in the GitHub Actions tab.
name: Hello World with Python

# Events that start this workflow.
on:
  # Run when code is pushed to the main branch.
  push:
    branches:
      - main
  # Allow the workflow to be started manually from the UI.
  workflow_dispatch:

# Defines the jobs that run as part of the workflow.
jobs:
  hello-python:
    name: Run the Python Hello World program
    # Specifies the virtual machine runner environment.
    runs-on: ubuntu-latest
    steps:
      # Checks out the repository code onto the runner.
      - name: Check out the repository
        uses: actions/checkout@v4
        
      # Runs the Python script with a custom environment variable.
      - name: Run the Python program
        env:
          WHO_TO_GREET: 'GitHub Actions Student'
        run: python hello.py
